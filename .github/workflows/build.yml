name: Build DeskPet unsigned IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "DeskPet/**"
      - "DeskPetWidget/**"
      - "Shared/**"
      - "PetAssets/**"
      - "project.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project DeskPet.xcodeproj \
            -scheme DeskPet \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/DeskPet.app" Payload/
          zip -qry DeskPet-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DeskPet-unsigned-ipa
          path: DeskPet-unsigned.ipa
