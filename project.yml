name: DeskPet
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  DeskPet:
    type: application
    platform: iOS
    sources:
      - path: DeskPet
      - path: Shared
      - path: PetAssets
    dependencies:
      - target: DeskPetWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.deskpet
        PRODUCT_NAME: DeskPet
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DeskPet
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0

  DeskPetWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: DeskPetWidget
        excludes:
          - "Info.plist"
      - path: Shared
      - path: PetAssets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.deskpet.widget
        PRODUCT_NAME: DeskPetWidget
        INFOPLIST_FILE: DeskPetWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
